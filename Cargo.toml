[package]
name = "srnk"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Shrink the JPEGs in a folder into a srnk/ copy folder"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
image = "0.25"
img-parts = "0.4"
kamadak-exif = "0.6"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[lints.clippy]
all = "warn"
